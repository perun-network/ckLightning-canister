[package]
name = "cklightning"
version = "0.1.0"
edition = "2024"

[lib]
# https://github.com/rust-lang/cargo/issues/4881
crate-type = ["cdylib", "rlib"]
name = "cklightning"

[dependencies]
lazy_static = "1"
ic-cdk-macros = "0.18.2"
candid = "=0.10.19"
ic-cdk = "0.18.7"
ic-ledger-types = "0.15.0"
icrc-ledger-types = "0.1.10"
serde = "=1.0.219"
serde_bytes = "=0.11.17"
async-trait = "0.1"
digest = "0.10"
sha2 = "0.10"
hex = "0.4.3"
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
k256 = "0.13.4"
lightning-invoice = "0.33.0"
lightning = "0.0.113"
bitcoin = { version = "0.32", features = ["rand"] }
num-traits = "0.2.19"
rand = "0.8"

[profile.release]
overflow-checks = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ic-agent = { version = "0.39.3", features = ["wasm-bindgen"] }
